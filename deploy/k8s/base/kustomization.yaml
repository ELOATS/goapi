apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: goapi

labels:
  - pairs:
      app.kubernetes.io/part-of: goapi
    includeSelectors: false   # 选择器不可变，公共标签不要写进 selector

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - api-deployment.yaml
  - api-service.yaml
  - api-hpa.yaml
  - api-pdb.yaml
  - api-networkpolicy.yaml
  - migrate-job.yaml
  - alertbridge.yaml
  - relay.yaml
  - consumer.yaml

# 带 goapi.example.com/phase: pre-deploy 标签的资源（命名空间、ServiceAccount、配置、密钥、迁移 Job）
# 会在发布第一步单独应用，迁移成功后才更新 Deployment，见 Makefile 的 k8s-deploy。
configMapGenerator:
  - name: goapi-config
    envs: [config.env]
    options:
      labels:
        goapi.example.com/phase: pre-deploy

# 密钥不进仓库：复制 *.example 去掉后缀再填写（已在 .gitignore 中忽略）。
# 生成的名字带内容哈希，密钥或配置一改，Deployment 会自动滚动更新。
secretGenerator:
  - name: goapi-secrets
    envs: [secrets.env]
    options:
      labels:
        goapi.example.com/phase: pre-deploy
  - name: alertbridge-secrets
    envs: [alertbridge-secrets.env]

# 基础镜像名占位，在 overlay 里替换成真实仓库和标签
images:
  - name: goapi-api
    newName: ghcr.io/your-org/goapi/api
    newTag: latest
  - name: goapi-alertbridge
    newName: ghcr.io/your-org/goapi/alertbridge
    newTag: latest
  - name: goapi-relay
    newName: ghcr.io/your-org/goapi/relay
    newTag: latest
  - name: goapi-consumer
    newName: ghcr.io/your-org/goapi/consumer
    newTag: latest
