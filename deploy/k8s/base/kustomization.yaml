apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: goapi

labels:
  - pairs:
      app.kubernetes.io/part-of: goapi
    includeSelectors: false   # 选择器不可变，公共标签不要写进 selector

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - api-deployment.yaml
  - api-service.yaml
  - api-hpa.yaml
  - api-pdb.yaml
  - api-networkpolicy.yaml
  - migrate-job.yaml
  - alertbridge.yaml
  - relay.yaml
  - consumer.yaml

# 带 goapi.example.com/phase: pre-deploy 标签的资源（命名空间、ServiceAccount、配置、密钥、迁移 Job）
# 会在发布第一步单独应用，迁移成功后才更新 Deployment，见 Makefile 的 k8s-deploy。
configMapGenerator:
  - name: goapi-config
    envs: [config.env]
    options:
      labels:
        goapi.example.com/phase: pre-deploy

# 密钥不进仓库：复制 *.example 去掉后缀再填写（已在 .gitignore 中忽略）。
# 生成的名字带内容哈希，密钥或配置一改，Deployment 会自动滚动更新。
secretGenerator:
  - name: goapi-secrets
    envs: [secrets.env]
    options:
      labels:
        goapi.example.com/phase: pre-deploy
  - name: alertbridge-secrets
    envs: [alertbridge-secrets.env]

# 镜像在各 overlay 里设置，base 不写 images。
# Deployment / Job 里的 image 是占位名 goapi-api 等，overlay 的 images 按这个名字匹配。
# 如果 base 里先把它改成了 ghcr.io/...，overlay 就再也匹配不到，
# 写在 overlay 里的仓库和标签（kind 的 goapi/api:kind、production 的 v0.1.0、CD 的 kustomize edit set image）都会被静默忽略。c