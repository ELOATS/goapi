apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: goapi-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: goapi-api
  minReplicas: 2
  # 上限受数据库连接数约束：maxReplicas × DB_MAX_CONNS 要小于 Postgres 的 max_connections
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # 相对于 requests.cpu
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      # 缩容慢一点，避免流量抖动时反复扩缩
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
