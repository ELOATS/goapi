# 只限制入站。出站（数据库、OTLP、DNS）因集群而异，按需再加 Egress 规则。
# 需要集群的 CNI 支持 NetworkPolicy（Calico、Cilium 等）。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: goapi-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: goapi-api
  policyTypes: [Ingress]
  ingress:
    # 业务端口只允许 Envoy Gateway 的代理访问。应用信任 X-Envoy-External-Address 作为客户端 IP，
    # 如果集群里其它 Pod 也能直连，它们就能伪造这个头绕过按 IP 的限流。
    # Envoy Gateway 默认把代理 Pod 放在 envoy-gateway-system 命名空间，不是的话按实际修改。
    # 集群内其它服务需要调用 API 时，在这里加一条 from，并给它们单独的限流考虑。
    # （kubectl port-forward 走的是 Pod 内的回环地址，不受这条策略影响，CD 的冒烟测试照常可用。）
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - port: 8080
    # 指标端口：只允许 monitoring 命名空间（Prometheus 所在处），按实际名称修改
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
