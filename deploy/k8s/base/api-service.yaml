apiVersion: v1
kind: Service
metadata:
  name: goapi-api
  labels:
    app.kubernetes.io/name: goapi-api
spec:
  selector:
    app.kubernetes.io/name: goapi-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
# 指标单独一个 Service，只给 Prometheus 用；不要被 HTTPRoute 引用
apiVersion: v1
kind: Service
metadata:
  name: goapi-api-metrics
  labels:
    app.kubernetes.io/name: goapi-api
    app.kubernetes.io/component: metrics
spec:
  selector:
    app.kubernetes.io/name: goapi-api
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
