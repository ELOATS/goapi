# 需要 Prometheus Operator 的 CRD。release 标签要与你的 Prometheus 的 serviceMonitorSelector 匹配
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: goapi-api
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: goapi-api
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      interval: 15s
      # 让 job 标签固定为 goapi，与告警规则和 Grafana 面板里的 job="goapi" 一致
      relabelings:
        - targetLabel: job
          replacement: goapi
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: goapi-relay
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: goapi-relay
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      interval: 15s
      relabelings:
        - targetLabel: job
          replacement: goapi-relay
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: goapi-consumer
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: goapi-consumer
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      interval: 15s
      relabelings:
        - targetLabel: job
          replacement: goapi-consumer
