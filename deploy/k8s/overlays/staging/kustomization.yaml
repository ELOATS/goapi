apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 与生产同一个 base，部署到独立命名空间
namespace: goapi-staging

resources:
  - ../../base
  - gateway.yaml

# 镜像版本由 deploy 工作流在运行时写入（kustomize edit set image），这里只是默认值
images:
  - name: goapi-api
    newName: ghcr.io/your-org/goapi/api
    newTag: latest
  - name: goapi-alertbridge
    newName: ghcr.io/your-org/goapi/alertbridge
    newTag: latest
  - name: goapi-relay
    newName: ghcr.io/your-org/goapi/relay
    newTag: latest
  - name: goapi-consumer
    newName: ghcr.io/your-org/goapi/consumer
    newTag: latest

configMapGenerator:
  - name: goapi-config
    behavior: merge
    literals:
      - TRACE_SAMPLE_RATIO=1.0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.monitoring.svc:4318

patches:
  # 预发环境省资源：固定 1–3 个副本
  - target:
      kind: HorizontalPodAutoscaler
      name: goapi-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: Deployment
      name: goapi-alertbridge
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
