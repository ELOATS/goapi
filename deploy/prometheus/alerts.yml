# 由模板生成；阈值是起点，请按你的流量和 SLO 调整。
groups:
- name: goapi-alerts
  rules:
  - alert: Watchdog
    expr: vector(1)
    labels:
      severity: none
      service: goapi
    annotations:
      summary: 告警链路心跳（始终触发）
      description: 这条告警永远处于触发状态。如果死信监控服务收不到它，说明 Prometheus 或 Alertmanager 本身出了问题。
      runbook_url: https://github.com/your-org/goapi/blob/main/deploy/RUNBOOK.md#watchdog
  - alert: GoapiInstanceDown
    expr: up{job="goapi"} == 0
    for: 1m
    labels:
      severity: critical
      service: goapi
    annotations:
      summary: goapi 实例 {{ $labels.instance }} 无法抓取
      description: Prometheus 已连续 1 分钟抓不到 {{ $labels.instance }} 的 /metrics。
      runbook_url: https://github.com/your-org/goapi/blob/main/deploy/RUNBOOK.md#goapiinstancedown
  - alert: GoapiTargetMissing
    expr: absent(up{job="goapi"})
    for: 5m
    labels:
      severity: critical
      service: goapi
    annotations:
      summary: Prometheus 中没有任何 goapi 抓取目标
      description: 服务发现或抓取配置可能有误，所有 goapi 告警都已失效。
      runbook_url: https://github.com/your-org/goapi/blob/main/deploy/RUNBOOK.md#goapitargetmissing
  - alert: GoapiCrashLooping
    expr: changes(process_start_time_seconds{job="goapi"}[30m]) > 2
    labels:
      severity: warning
      service: goapi
    annotations:
      summary: goapi 实例 {{ $labels.instance }} 频繁重启
      description: 30 分钟内重启了 {{ $value }} 次，检查 OOM、panic 或启动失败（数据库连接、迁移）。
      runbook_url: https://github.com/your-org/goapi/blob/main/deploy/RUNBOOK.md#goapicrashlooping
  - alert: GoapiErrorBudgetFastBurn
    expr: 'job:http_request_errors:ratio_rate1h > (14.4 * 0.001)

      and

      job:http_request_errors:ratio_rate5m > (14.4 * 0.001)

      '
    for: 2m
    labels:
      severity: critical
      service: goapi
    annotations:
      summary: goapi 错误预算快速消耗（99.9% SLO）
      description: 过去 1 小时 5xx 比例为 {{ $value | humanizePercentage }}，按此速度约 2 天耗尽 30 天的错误预算。
      runbook_url: https://github.com/your-org/goapi/blob/main/deploy/RUNBOOK.md#goapierrorbudgetfastburn
  - alert: GoapiErrorBudgetSlowBurn
    expr: 'job:http_request_errors:ratio_rate6h > (6 * 0.001)

      and

      job:http_request_errors:ratio_rate30m > (6 * 0.001)

      '
    for: 15m
    labels:
      severity: warning
      service: goapi
    annotations:
      summary: goapi 错误预算持续消耗（99.9% SLO）
      description: 过去 6 小时 5xx 比例为 {{ $value | humanizePercentage }}，按此速度约 5 天耗尽 30 天的错误预算。
      runbook_url: https://github.com/your-org/goapi/blob/main/deploy/RUNBOOK.md#goapierrorbudgetslowburn
  - alert: GoapiHighLatencyP99
    expr: 'route:http_request_duration_seconds:p99_5m{route!="unmatched"} > 1

      and on (job, route)

      route:http_requests:rate5m > 0.5

      '
    for: 10m
    labels:
      severity: warning
      service: goapi
    annotations:
      summary: 路由 {{ $labels.route }} 的 P99 延迟超过 1s
      description: 当前 P99 为 {{ $value | humanizeDuration }}。先看 Jaeger 里该路由的慢 trace，确认是 SQL 还是下游调用。
      runbook_url: https://github.com/your-org/goapi/blob/main/deploy/RUNBOOK.md#goapihighlatencyp99
  - alert: GoapiDBPoolSaturated
    expr: max by (job, instance) (db_pool_acquired_conns{job="goapi"} / db_pool_max_conns{job="goapi"}) > 0.9
    for: 5m
    labels:
      severity: warning
      service: goapi
    annotations:
      summary: '{{ $labels.instance }} 数据库连接池使用率超过 90%'
      description: 使用率 {{ $value | humanizePercentage }}。可能是慢查询或长事务占着连接，或 DB_MAX_CONNS 偏小。
      runbook_url: https://github.com/your-org/goapi/blob/main/deploy/RUNBOOK.md#goapidbpoolsaturated
  - alert: GoapiDBPoolWaiting
    expr: rate(db_pool_empty_acquire_total{job="goapi"}[5m]) > 1
    for: 10m
    labels:
      severity: warning
      service: goapi
    annotations:
      summary: '{{ $labels.instance }} 请求在排队等数据库连接'
      description: 每秒约 {{ $value | humanize }} 次获取连接时池子为空。
      runbook_url: https://github.com/your-org/goapi/blob/main/deploy/RUNBOOK.md#goapidbpoolwaiting
  - alert: GoapiDBAcquireCanceled
    expr: increase(db_pool_canceled_acquire_total{job="goapi"}[5m]) > 0
    for: 2m
    labels:
      severity: critical
      service: goapi
    annotations:
      summary: '{{ $labels.instance }} 有请求因等不到数据库连接而超时'
      description: 5 分钟内 {{ $value | humanize }} 次获取连接被 context 取消，用户已经看到 504/500。
      runbook_url: https://github.com/your-org/goapi/blob/main/deploy/RUNBOOK.md#goapidbacquirecanceled
  - alert: GoapiGoroutineLeak
    expr: go_goroutines{job="goapi"} > 10000
    for: 15m
    labels:
      severity: warning
      service: goapi
    annotations:
      summary: '{{ $labels.instance }} goroutine 数量异常（{{ $value }}）'
      description: 持续 15 分钟超过 10000，疑似泄漏。开启 PPROF_ENABLED 后抓 /debug/pprof/goroutine?debug=2。
      runbook_url: https://github.com/your-org/goapi/blob/main/deploy/RUNBOOK.md#goapigoroutineleak
  - alert: GoapiRateLimiterErrors
    expr: sum by (job) (rate(http_rate_limit_decisions_total{job="goapi",result="error"}[5m])) > 0
    for: 5m
    labels:
      severity: warning
      service: goapi
    annotations:
      summary: goapi 限流器出错，请求正在被直接放行
      description: 每秒约 {{ $value | humanize }} 次限流判定失败（通常是 Redis 不可用或超时）。期间限流不生效。
      runbook_url: https://github.com/your-org/goapi/blob/main/deploy/RUNBOOK.md#goapiratelimitererrors
  - alert: GoapiRelayAllDown
    expr: absent(up{job="goapi-relay"} == 1)
    for: 3m
    labels:
      severity: critical
      service: goapi
    annotations:
      summary: 没有正常运行的 outbox relay
      description: 所有 relay 实例都抓不到（或一个都没有），事件不会被投递，积压会一直增长。
      runbook_url: https://github.com/your-org/goapi/blob/main/deploy/RUNBOOK.md#goapirelayalldown
  - alert: GoapiOutboxLagging
    expr: max(outbox_oldest_pending_age_seconds{job="goapi-relay"}) > 300
    for: 5m
    labels:
      severity: warning
      service: goapi
    annotations:
      summary: outbox 事件投递延迟超过 5 分钟
      description: 最早的待投递事件已等待 {{ $value | humanizeDuration }}，通常是 NATS 不可用或某条事件一直发布失败。
      runbook_url: https://github.com/your-org/goapi/blob/main/deploy/RUNBOOK.md#goapioutboxlagging
  - alert: GoapiOutboxDeadEvents
    expr: max(outbox_dead_events{job="goapi-relay"}) > 0
    for: 1m
    labels:
      severity: warning
      service: goapi
    annotations:
      summary: 有 outbox 事件进入死信
      description: 有事件被判定为无法投递（例如消息过大或事件类型非法），已停止重试，需要人工处理。
      runbook_url: https://github.com/your-org/goapi/blob/main/deploy/RUNBOOK.md#goapioutboxdeadevents
  - alert: GoapiConsumerAllDown
    expr: absent(up{job="goapi-consumer"} == 1)
    for: 3m
    labels:
      severity: critical
      service: goapi
    annotations:
      summary: 没有正常运行的事件消费者
      description: 所有 consumer 实例都抓不到（或一个都没有），消息会在 JetStream 里积压。
      runbook_url: https://github.com/your-org/goapi/blob/main/deploy/RUNBOOK.md#goapiconsumeralldown
  - alert: GoapiConsumerLagging
    expr: max(consumer_pending_messages{job="goapi-consumer"}) > 1000
    for: 10m
    labels:
      severity: warning
      service: goapi
    annotations:
      summary: 事件消费者积压超过 1000 条
      description: 当前有 {{ $value | humanize }} 条消息还没投递给消费者。
      runbook_url: https://github.com/your-org/goapi/blob/main/deploy/RUNBOOK.md#goapiconsumerlagging
  - alert: GoapiConsumerDeadLetters
    expr: max(consumer_dead_letters{job="goapi-consumer"}) > 0
    for: 1m
    labels:
      severity: warning
      service: goapi
    annotations:
      summary: 事件消费者有死信
      description: 有消息处理失败并已停止重试，需要修复后重放。
      runbook_url: https://github.com/your-org/goapi/blob/main/deploy/RUNBOOK.md#goapiconsumerdeadletters
